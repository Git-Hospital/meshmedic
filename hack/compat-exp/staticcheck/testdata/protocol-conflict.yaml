# Trimmed from argo-cd 10.11.1: one container port, declared http by one
# Service port and https by another.
apiVersion: v1
kind: Service
metadata:
  name: server
spec:
  selector:
    app: server
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: https
      port: 443
      targetPort: server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: server
          ports:
            - name: server
              containerPort: 8080
