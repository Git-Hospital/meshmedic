# No policyTypes: Ingress is implied, so no rules means deny.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: implied-ingress
spec:
  podSelector: {}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-replicas
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: redis
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
