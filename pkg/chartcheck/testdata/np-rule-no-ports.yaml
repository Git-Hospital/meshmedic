# A rule without ports admits every port, 15008 included; its peers are
# pods, so the kubelet probe from 169.254.7.127 is still dropped.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: same-namespace
spec:
  podSelector: {}
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-replicas
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: redis
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
