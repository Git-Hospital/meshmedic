# A MySQL port declared HTTP: Istio parses it as HTTP and the server's
# greeting never gets through.
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: db
  ports:
    - name: http-mysql
      port: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: mysql
