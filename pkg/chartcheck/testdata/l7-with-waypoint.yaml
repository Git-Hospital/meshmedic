# The same objects with a waypoint Gateway in the chart.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-get
spec:
  selector:
    matchLabels:
      app: web
  rules:
    - from:
        - source:
            namespaces: [demo]
      to:
        - operation:
            methods: [GET]
            ports: ["8080"]
---
# Mesh routing that needs a waypoint in ambient, beside ingress routing that
# does not.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: web-mesh
spec:
  hosts: [web]
  http:
    - route:
        - destination:
            host: web
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: web-ingress
spec:
  hosts: [web.example.com]
  gateways: [demo/ingress]
  http:
    - route:
        - destination:
            host: web
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-gamma
spec:
  parentRefs:
    - kind: Service
      group: ""
      name: web
  rules:
    - backendRefs:
        - name: web
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-north-south
spec:
  parentRefs:
    - name: ingress
  rules:
    - backendRefs:
        - name: web
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
