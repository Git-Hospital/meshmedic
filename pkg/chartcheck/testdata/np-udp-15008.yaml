# 15008 over UDP does not admit HBONE, which is TCP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: udp
spec:
  podSelector: {}
  ingress:
    - ports:
        - port: 6379
        - port: 15008
          protocol: UDP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-replicas
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: redis
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
