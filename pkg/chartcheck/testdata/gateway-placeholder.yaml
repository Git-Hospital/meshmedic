# Istio's gateway chart 1.24.0 as rendered (trimmed). The container named
# istio-proxy with image "auto" is the injection placeholder of a gateway: the
# injector replaces it, so its UID and ports conflict with nothing.
apiVersion: v1
kind: Service
metadata:
  name: gw
  namespace: default
  labels:
    app.kubernetes.io/name: gw
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/instance: "gw"
    app.kubernetes.io/part-of: "istio"
    app.kubernetes.io/version: "1.24.0"
    app: gw
    istio: gw
  annotations:
    {}
spec:
  type: LoadBalancer
  ports:
    - name: status-port
      port: 15021
      protocol: TCP
      targetPort: 15021
    - name: http2
      port: 80
      protocol: TCP
      targetPort: 80
    - name: https
      port: 443
      protocol: TCP
      targetPort: 443
  selector:
    app: gw
    istio: gw
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gw
  namespace: default
  labels:
    app.kubernetes.io/name: gw
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/instance: "gw"
    app.kubernetes.io/part-of: "istio"
    app.kubernetes.io/version: "1.24.0"
    app: gw
    istio: gw
  annotations:
    {}
spec:
  selector:
    matchLabels:
      app: gw
      istio: gw
  template:
    metadata:
      annotations:
        inject.istio.io/templates: gateway
        prometheus.io/path: /stats/prometheus
        prometheus.io/port: "15020"
        prometheus.io/scrape: "true"
        sidecar.istio.io/inject: "true"
      labels:
        sidecar.istio.io/inject: "true"
        app: gw
        istio: gw
        app.kubernetes.io/name: gw
        app.kubernetes.io/managed-by: "Helm"
        app.kubernetes.io/instance: "gw"
        app.kubernetes.io/part-of: "istio"
        app.kubernetes.io/version: "1.24.0"
        helm.sh/chart: gateway-1.24.0
    spec:
      serviceAccountName: gw
      securityContext:
        # Safe since 1.22: https://github.com/kubernetes/kubernetes/pull/103326
        sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: "0"
      containers:
        - name: istio-proxy
          # "auto" will be populated at runtime by the mutating webhook. See https://istio.io/latest/docs/setup/additional-setup/sidecar-injection/#customizing-injection
          image: auto
          securityContext:
            capabilities:
              drop:
              - ALL
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsUser: 1337
            runAsGroup: 1337
            runAsNonRoot: true
          env:
          ports:
          - containerPort: 15090
            protocol: TCP
            name: http-envoy-prom
          resources:
            limits:
              cpu: 2000m
              memory: 1024Mi
            requests:
              cpu: 100m
              memory: 128Mi
      terminationGracePeriodSeconds: 30
