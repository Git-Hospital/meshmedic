entry: waypoint-overload-scale
summary: >
  A baseline is warmed on the demo's normal traffic, then the background
  loadgen is scaled from one replica to eight, so the waypoint's per-replica
  request rate climbs to several times its learned normal. The static 1000
  is eighty times the testbed's normal and out of reach on one kind node;
  the relative threshold is the reason this entry can be proven at all.

  The target's workload is the waypoint deployment, because the signal
  divides by its ready pods. The demo's shared target names payments-v2,
  which divides by the canary's pods instead; on the testbed both have one
  pod, so the numbers agree until either is scaled.
target:
  service: payments
  namespace: demo
  workload: waypoint
# Long enough to pass the entry's baselineMinSamples at the default poll, so
# the detector trusts the learned normal instead of falling back to 1000.
warmup: 6m
inject:
  - desc: eight times the background traffic through the waypoint
    run: [kubectl, --context=kind-meshmedic-demo, -n, demo, scale, deploy/loadgen, --replicas=8]
  - run: [kubectl, --context=kind-meshmedic-demo, -n, demo, rollout, status, deploy/loadgen, --timeout=180s]
reset:
  - run: [kubectl, --context=kind-meshmedic-demo, -n, demo, scale, deploy/loadgen, --replicas=1]
  - run: [kubectl, --context=kind-meshmedic-demo, -n, demo, rollout, status, deploy/loadgen, --timeout=180s]
settle: 60s
firesWithin: 7m
resolvesWithin: 7m
expect:
  names:
    - waypoint
