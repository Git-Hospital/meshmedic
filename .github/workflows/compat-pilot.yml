name: compat-pilot

# The pilot ADR 0001 asks for before any engine code: install each chart in
# hack/compat-pilot/charts.json unchanged in four throwaway worlds, three runs
# each, and table every observation that differs from the no-mesh world. See
# docs/compat-pilot.md.
#
# It runs on the pilot branch and by hand, never on pull requests: one pass is
# dozens of kind clusters, and the answer it gives is about third-party charts,
# not about a change to this repository.
on:
  push:
    branches: [feat/compat-pilot]
    paths:
      - "hack/compat-pilot/**"
      - ".github/workflows/compat-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

# Pinned, and recorded in every result. Kubernetes 1.36 sits inside the
# support window of both Istio 1.31 and 1.30, so a later comparison with the
# previous release can run on the same node image.
env:
  ISTIO_VERSION: "1.31.3"
  KIND_VERSION: "v0.33.0"
  KIND_NODE_IMAGE: "kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed"
  HELM_VERSION: "v4.0.4"
  GATEWAY_API_VERSION: "v1.6.0"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.charts.outputs.charts }}
    steps:
      - uses: actions/checkout@v4
      - id: charts
        run: echo "charts=$(jq -c '[.[].id]' hack/compat-pilot/charts.json)" >> "$GITHUB_OUTPUT"

  observe:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJSON(needs.plan.outputs.charts) }}
        world: [W0, W1, W2, W3]
    steps:
      - uses: actions/checkout@v4

      # The runner's 14 GB disk, not its CPU or memory, is what a node image,
      # Istio and a chart's images run out of first.
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: raise inotify limits
        run: sudo sysctl -w fs.inotify.max_user_watches=524288 fs.inotify.max_user_instances=512

      - name: install pinned tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin" && cd "$RUNNER_TEMP"

          curl -fsSLO "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLO "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64.sha256sum"
          sha256sum -c kind-linux-amd64.sha256sum
          install kind-linux-amd64 "$HOME/bin/kind"

          tarball="istioctl-${ISTIO_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/istio/istio/releases/download/${ISTIO_VERSION}/${tarball}"
          curl -fsSLO "https://github.com/istio/istio/releases/download/${ISTIO_VERSION}/${tarball}.sha256"
          # Istio's checksum file has one space where sha256sum expects two.
          echo "$(cut -d' ' -f1 "${tarball}.sha256")  ${tarball}" | sha256sum -c
          tar xzf "$tarball" && install istioctl "$HOME/bin/istioctl"

          curl -fsSLO "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum"
          sha256sum -c "helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum"
          tar xzf "helm-${HELM_VERSION}-linux-amd64.tar.gz" && install linux-amd64/helm "$HOME/bin/helm"

          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: world ${{ matrix.world }}
        run: hack/compat-pilot/world.sh "${{ matrix.world }}"

      # A run that cannot decide (exit 3) ends the loop: the namespace it left
      # behind would leak into every later run. The table reports the missing
      # runs as undecided, never as compatible.
      - name: three runs of ${{ matrix.chart }}
        run: |
          set -uo pipefail
          for run in 1 2 3; do
            hack/compat-pilot/observe.sh "${{ matrix.world }}" "${{ matrix.chart }}" "$run" results || exit $?
          done

      - name: cluster state on failure
        if: failure()
        run: |
          KUBECONFIG="$PWD/.mmc-state/mmc-$(tr '[:upper:]' '[:lower:]' <<<"${{ matrix.world }}").kubeconfig"
          export KUBECONFIG
          mkdir -p results/debug
          kubectl get pods -A -o wide > results/debug/pods.txt 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > results/debug/events.txt 2>&1 || true
          tail -50 results/debug/events.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.chart }}-${{ matrix.world }}
          path: results/
          if-no-files-found: warn

  table:
    needs: observe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
          merge-multiple: true
      - name: table
        run: |
          rm -rf results/debug
          go run ./hack/compat-pilot/difftable results | tee table.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: compat-pilot-table
          path: |
            table.md
            results/
