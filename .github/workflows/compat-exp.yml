name: compat-exp

# GitHub evaluates run-name from THIS file at the run's commit and returns it as the
# run's display_title, so analyze.sh learns the mode and the Istio version from GitHub
# and not only from the uploaded metadata artifact. The format is fixed and parsed:
#   compat-exp mode=<mode> istio=<istio> charts=<charts_file> fixes=<fixes_file> ids=<chart_ids> fix=<fix_id>
# mode and istio are choices (no spaces); the four strings after them are the inputs as
# given. Do not change it after the freeze (the workflow directory is frozen).
# On a push (the acceptance trial, see below) there are no inputs, and run-name can only
# use expressions, so the fixed values of the acceptance run are spelled out here and in
# the top-level env block, nowhere else; the three free strings are empty on a push.
run-name: compat-exp mode=${{ github.event_name == 'push' && 'acceptance' || inputs.mode }} istio=${{ github.event_name == 'push' && '1.31.3' || inputs.istio }} charts=${{ github.event_name == 'push' && 'hack/compat-exp/acceptance-charts.json' || inputs.charts_file }} fixes=${{ inputs.fixes_file }} ids=${{ inputs.chart_ids }} fix=${{ inputs.fix_id }}

# The compat experiment (docs/compat-experiment.md): install popular third-party
# charts, unchanged, in throwaway kind worlds W0 (no mesh), W1 (sidecar) and W3
# (ambient), three runs each, and table what differs. Modes:
#
#   acceptance  the ten pilot-1 charts and the redis fix as values and as a
#               patch (work item 9). The only mode that runs before the tag
#               compat-exp-freeze exists.
#   qualify     W0 only, one job per candidate: hack/compat-exp/qualify.sh.
#               The last job runs select.sh and uploads charts-exp.json.
#   observe     the frozen list (hack/compat-exp/charts-exp.json), W0/W1/W3.
#   certify     one fix entry (fix_id) and its base chart, W0/W1/W3, then
#               difftable with -cell-worlds and -ignore from the entry.
#   recheck     chart_ids again on the recheck Istio version.
#
# Dispatch by hand only, with one exception: GitHub accepts a manual dispatch only
# for a workflow file on the default branch, and this file is not there before the
# instrument is merged. So the acceptance trial (and nothing else) can also be started
# by a push to the branch compat-exp-acceptance, as compat-pilot.yml does on its own
# branch. A push has no inputs: the top-level env block below gives it the acceptance
# run's fixed values, and guard.sh refuses a push whose mode is not acceptance or
# whose ref is not refs/heads/compat-exp-acceptance. A push can never start qualify,
# observe, certify or recheck; analyze.sh refuses every push run. No pull request
# trigger of any kind.
#
# SECURITY. The charts under test are third-party code. They run inside a
# throwaway kind cluster on the runner, next to the runner's checkout, the
# runner's network and the job token. This workflow therefore holds no secrets,
# uses none, and has read-only permissions (contents: read, nothing broader).
# It must never be given a secret, a deploy key, a write permission or a
# self-hosted runner: a hostile chart that escapes the cluster would find
# them. Every workflow input reaches a script through `env:` and is validated by
# hack/compat-exp/guard.sh against a strict pattern first; no input is ever
# interpolated into a `run:` block. The push trigger adds no event data to any
# script: the branch name, commit message and author are never read, only the
# event name and the ref, and the guard compares those with fixed strings.

on:
  # No path filter: pushing an empty commit reruns the trial. Only people with
  # write access can push a branch here; a fork cannot fire it.
  push:
    branches:
      - compat-exp-acceptance
  workflow_dispatch:
    inputs:
      mode:
        description: "acceptance, qualify, observe, certify or recheck"
        type: choice
        required: true
        default: acceptance
        options:
          - acceptance
          - qualify
          - observe
          - certify
          - recheck
      charts_file:
        description: "Chart list under hack/compat-exp/ (empty: acceptance-charts.json, candidates-charts.json or charts-exp.json by mode)"
        type: string
        required: false
        default: ""
      fixes_file:
        description: "Fix entries under hack/compat-exp/fixes/ (observe, certify, recheck; empty for none)"
        type: string
        required: false
        default: ""
      chart_ids:
        description: "Chart or fix ids, separated by spaces (empty: the list's primary charts; required for recheck)"
        type: string
        required: false
        default: ""
      fix_id:
        description: "certify only: the fix entry to certify"
        type: string
        required: false
        default: ""
      istio:
        description: "Istio version. Every mode but recheck needs the first value; recheck needs the second."
        type: choice
        required: true
        default: "1.31.3"
        options:
          - "1.31.3"
          # FREEZE EDIT, this one line: replace the placeholder with the recheck
          # version decided at the freeze (docs/compat-experiment.md section 4).
          # While it still reads like this, mode recheck fails in the guard.
          - "recheck-version-undecided"

permissions:
  contents: read

# Runs are never cancelled by a newer dispatch: a half-finished run 1 is lost
# data, and the 12 h gap between the two runs is part of the design.
concurrency:
  group: compat-exp-${{ github.ref }}
  cancel-in-progress: false

# Pinned, and recorded in every result. The Istio version is the dispatch
# input, validated by the guard; ISTIO_PRIMARY is the version of every mode
# but recheck. The registry mirror is on in EVERY world, W0 included.
#
# The GUARD_* variables are the effective inputs of the run, computed here once and
# read by every step that needs them (guard.sh, the ledger check, the run metadata).
# A dispatch passes its inputs through; a push has none and gets the acceptance
# run: mode acceptance, Istio 1.31.3 (must equal ISTIO_PRIMARY, a test checks it),
# the acceptance chart list, and no fixes file, chart ids or fix id (empty on a push).
# GUARD_EVENT and GUARD_REF let the guard refuse a push that is anything else.
env:
  GUARD_EVENT: ${{ github.event_name }}
  GUARD_REF: ${{ github.ref }}
  GUARD_MODE: ${{ github.event_name == 'push' && 'acceptance' || inputs.mode }}
  GUARD_ISTIO: ${{ github.event_name == 'push' && '1.31.3' || inputs.istio }}
  GUARD_CHARTS_FILE: ${{ github.event_name == 'push' && 'hack/compat-exp/acceptance-charts.json' || inputs.charts_file }}
  GUARD_FIXES_FILE: ${{ inputs.fixes_file }}
  GUARD_CHART_IDS: ${{ inputs.chart_ids }}
  GUARD_FIX_ID: ${{ inputs.fix_id }}
  ISTIO_PRIMARY: "1.31.3"
  KIND_VERSION: "v0.33.0"
  KIND_NODE_IMAGE: "kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed"
  HELM_VERSION: "v4.0.4"
  MMC_REGISTRY_MIRROR: "1"

jobs:
  # Before any cluster work: the freeze, the hash, the fix entries, the inputs.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: guard
        run: hack/compat-exp/guard.sh check
      # Certification and recheck rest on the ledger (docs/compat-experiment.md
      # sections 2 and 3: new keys, classifications), so it must pass its schema
      # check before a cluster is built for them. The guard step above has already
      # shown that the ledger tool is the frozen one. The other post-run tools
      # (static.sh, crossrun) run on a maintainer's machine through
      # hack/compat-exp/analyze.sh, not here.
      # actions/setup-go v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          # No cache of any kind: a later, more trusted job must never restore
          # something an earlier job on a runner with hostile charts wrote.
          cache: false
      - name: ledger check
        run: |
          set -euo pipefail
          if [ "$GUARD_MODE" = certify ] || [ "$GUARD_MODE" = recheck ]; then
            go run ./hack/compat-exp/ledger/cmd/ledger check
          else
            echo "ledger check: not needed in mode $GUARD_MODE"
          fi

      # The record of what this run was, for the analysis to decide whether it
      # is admissible (hack/compat-exp/analyze.sh downloads it and cross-checks
      # it against `gh run view`). Written here, in the guard job, and nowhere
      # else: this job never runs a chart. Everything in it comes from workflow
      # context and the checked-out commit: nothing from a chart, a record or a
      # cluster. chartsFile is the file the guard resolved (the mode's default
      # when the input is empty), chartsSha256 its hash at headSha, freezeTagSha
      # the commit the freeze tag points to ("" before the tag exists), fixId ""
      # outside certify; fixesFile and chartIds are the dispatch inputs as given.
      - name: run metadata
        env:
          MD_MODE: ${{ env.GUARD_MODE }}
          MD_ISTIO: ${{ env.GUARD_ISTIO }}
          MD_CHARTS_FILE: ${{ env.GUARD_CHARTS_FILE }}
          MD_FIXES_FILE: ${{ env.GUARD_FIXES_FILE }}
          MD_CHART_IDS: ${{ env.GUARD_CHART_IDS }}
          MD_FIX_ID: ${{ env.GUARD_FIX_ID }}
          MD_HEAD_SHA: ${{ github.sha }}
          MD_WORKFLOW_REF: ${{ github.workflow_ref }}
          MD_EVENT_NAME: ${{ github.event_name }}
          MD_RUN_ID: ${{ github.run_id }}
          MD_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          case "$MD_MODE" in
            acceptance) charts_file=hack/compat-exp/acceptance-charts.json ;;
            qualify) charts_file="${MD_CHARTS_FILE:-hack/compat-exp/candidates-charts.json}" ;;
            *) charts_file="${MD_CHARTS_FILE:-hack/compat-exp/charts-exp.json}" ;;
          esac
          charts_sha="$(sha256sum "$charts_file" | cut -d' ' -f1)"
          freeze_sha="$(git rev-parse -q --verify 'refs/tags/compat-exp-freeze^{commit}' || true)"
          mkdir -p run-metadata
          jq -n \
            --arg mode "$MD_MODE" --arg istio "$MD_ISTIO" --arg chartsFile "$charts_file" \
            --arg chartsSha256 "$charts_sha" --arg fixesFile "$MD_FIXES_FILE" --arg chartIds "$MD_CHART_IDS" \
            --arg fixId "$MD_FIX_ID" --arg headSha "$MD_HEAD_SHA" --arg freezeTagSha "$freeze_sha" \
            --arg workflowRef "$MD_WORKFLOW_REF" --arg eventName "$MD_EVENT_NAME" \
            --argjson runId "$MD_RUN_ID" --argjson runAttempt "$MD_RUN_ATTEMPT" \
            '{schema: 1, mode: $mode, istio: $istio, chartsFile: $chartsFile, chartsSha256: $chartsSha256,
              fixesFile: $fixesFile, chartIds: $chartIds, fixId: $fixId, headSha: $headSha,
              freezeTagSha: $freezeTagSha, workflowRef: $workflowRef, eventName: $eventName,
              runId: $runId, runAttempt: $runAttempt}' \
            >run-metadata/run-metadata.json
          cat run-metadata/run-metadata.json
      # actions/upload-artifact v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: run-metadata/run-metadata.json
          if-no-files-found: error

  # The matrix, computed from the chart list. guard.sh fails the run if it
  # would pass 256 jobs (GitHub's limit per run).
  plan:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      mode: ${{ steps.plan.outputs.mode }}
      kind: ${{ steps.plan.outputs.kind }}
      istio: ${{ steps.plan.outputs.istio }}
      fix_id: ${{ steps.plan.outputs.fix_id }}
      cell_worlds: ${{ steps.plan.outputs.cell_worlds }}
      ignore: ${{ steps.plan.outputs.ignore }}
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - id: plan
        run: hack/compat-exp/guard.sh plan plan >> "$GITHUB_OUTPUT"
      # The effective chart list (frozen charts, reserves and fix entries) that
      # every job below reads through CHARTS_FILE.
      # actions/upload-artifact v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plan-${{ github.run_id }}
          path: plan/
          if-no-files-found: error

  qualify:
    needs: plan
    if: needs.plan.outputs.kind == 'qualify'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      ISTIO_VERSION: ${{ needs.plan.outputs.istio }}
      CHARTS_FILE: ${{ github.workspace }}/plan/charts.json
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/download-artifact v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: plan-${{ github.run_id }}
          path: plan
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: raise inotify limits
        run: sudo sysctl -w fs.inotify.max_user_watches=524288 fs.inotify.max_user_instances=512
      - name: install pinned tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin" && cd "$RUNNER_TEMP"

          curl -fsSLO --retry 4 --retry-all-errors "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLO --retry 4 --retry-all-errors "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64.sha256sum"
          sha256sum -c kind-linux-amd64.sha256sum
          install kind-linux-amd64 "$HOME/bin/kind"

          curl -fsSLO --retry 4 --retry-all-errors "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO --retry 4 --retry-all-errors "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum"
          sha256sum -c "helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum"
          tar xzf "helm-${HELM_VERSION}-linux-amd64.tar.gz" && install linux-amd64/helm "$HOME/bin/helm"

          echo "$HOME/bin" >> "$GITHUB_PATH"
          yq --version
      - name: world W0
        run: hack/compat-pilot/world.sh W0
      # A run that cannot decide (exit 3) fails the job; a chart that does not
      # qualify is a record, not a failure.
      - name: qualify the candidate
        env:
          CHART: ${{ matrix.chart }}
        run: hack/compat-exp/qualify.sh "$CHART" results
      - name: cluster state on failure
        if: failure()
        run: |
          KUBECONFIG="$PWD/.mmc-state/mmc-w0.kubeconfig"
          export KUBECONFIG
          mkdir -p results/debug
          kubectl get pods -A -o wide > results/debug/pods.txt 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > results/debug/events.txt 2>&1 || true
          tail -50 results/debug/events.txt || true
      # actions/upload-artifact v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qual-${{ github.run_id }}-${{ matrix.chart }}
          path: results/
          if-no-files-found: warn

  # The records become charts-exp.json: the first 50 qualified, 15 reserves,
  # the install deadline, the bias table and the hash. Fewer than 40 qualified
  # is the infeasible stop of section 7, and this job fails with that message.
  select:
    needs: [plan, qualify]
    if: ${{ !cancelled() && needs.plan.outputs.kind == 'qualify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # One directory per artifact (qual-artifacts/qual-<run>-<chart>/), never
      # merged: with merge-multiple a job whose chart is hostile could write a
      # file under another chart's name and replace that chart's record.
      # actions/download-artifact v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qual-${{ github.run_id }}-*
          path: qual-artifacts
      # The records are data and nothing else: no step sources, evals or runs
      # anything under qual-artifacts/. Of each artifact only the one file
      # <chart>.qualify.json is taken, and only when its own id is the chart the
      # artifact is named for; those files are copied to qual/, which select.sh
      # reads and the charts-exp artifact keeps. Anything else, a symbolic link,
      # no artifact at all, or a record that names another chart stops the job.
      - name: check records
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dirs=(qual-artifacts/qual-"$RUN_ID"-*/)
          if [ "${#dirs[@]}" -eq 0 ]; then echo "no qualification artifacts were downloaded" >&2; exit 1; fi
          if [ -n "$(find qual-artifacts -type l -print -quit)" ]; then echo "a symbolic link in the downloaded records" >&2; exit 1; fi
          rm -rf qual
          mkdir qual
          for d in "${dirs[@]}"; do
            d="${d%/}"
            chart="${d#qual-artifacts/qual-"$RUN_ID"-}"
            if ! [[ "$chart" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then echo "artifact $d has no usable chart id in its name" >&2; exit 1; fi
            rec="$d/$chart.qualify.json"
            if [ ! -f "$rec" ]; then echo "artifact $d holds no $chart.qualify.json" >&2; exit 1; fi
            if ! jq -e --arg c "$chart" '.id == $c' "$rec" >/dev/null; then
              echo "record $rec is not a record of chart $chart (the artifact it came from)" >&2
              exit 1
            fi
            cp -- "$rec" "qual/$chart.qualify.json"
          done
          echo "records checked: ${#dirs[@]} artifacts"
      - name: select
        run: |
          set -euo pipefail
          mkdir -p out
          hack/compat-exp/select.sh hack/compat-exp/candidates.json qual out/charts-exp.json | tee -a "$GITHUB_STEP_SUMMARY"
      # actions/upload-artifact v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: charts-exp-${{ github.run_id }}
          path: |
            out/
            qual/
          if-no-files-found: error

  observe:
    needs: plan
    if: needs.plan.outputs.kind == 'observe'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      ISTIO_VERSION: ${{ needs.plan.outputs.istio }}
      CHARTS_FILE: ${{ github.workspace }}/plan/charts.json
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/download-artifact v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: plan-${{ github.run_id }}
          path: plan
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: raise inotify limits
        run: sudo sysctl -w fs.inotify.max_user_watches=524288 fs.inotify.max_user_instances=512
      - name: install pinned tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin" && cd "$RUNNER_TEMP"

          curl -fsSLO --retry 4 --retry-all-errors "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLO --retry 4 --retry-all-errors "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64.sha256sum"
          sha256sum -c kind-linux-amd64.sha256sum
          install kind-linux-amd64 "$HOME/bin/kind"

          tarball="istioctl-${ISTIO_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO --retry 4 --retry-all-errors "https://github.com/istio/istio/releases/download/${ISTIO_VERSION}/${tarball}"
          curl -fsSLO --retry 4 --retry-all-errors "https://github.com/istio/istio/releases/download/${ISTIO_VERSION}/${tarball}.sha256"
          # Istio's checksum file has one space where sha256sum expects two.
          echo "$(cut -d' ' -f1 "${tarball}.sha256")  ${tarball}" | sha256sum -c
          tar xzf "$tarball" && install istioctl "$HOME/bin/istioctl"

          curl -fsSLO --retry 4 --retry-all-errors "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO --retry 4 --retry-all-errors "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum"
          sha256sum -c "helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum"
          tar xzf "helm-${HELM_VERSION}-linux-amd64.tar.gz" && install linux-amd64/helm "$HOME/bin/helm"

          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: world
        env:
          WORLD: ${{ matrix.world }}
        run: hack/compat-pilot/world.sh "$WORLD"
      # A run that cannot decide (exit 3) ends the loop: the namespace it left
      # behind would leak into every later run. The table reports the missing
      # runs as undecided, never as compatible.
      - name: three runs
        env:
          WORLD: ${{ matrix.world }}
          CHART: ${{ matrix.chart }}
        run: |
          set -uo pipefail
          for run in 1 2 3; do
            hack/compat-pilot/observe.sh "$WORLD" "$CHART" "$run" results || exit $?
          done
      - name: cluster state on failure
        if: failure()
        env:
          WORLD: ${{ matrix.world }}
        run: |
          KUBECONFIG="$PWD/.mmc-state/mmc-$(tr '[:upper:]' '[:lower:]' <<<"$WORLD").kubeconfig"
          export KUBECONFIG
          mkdir -p results/debug
          kubectl get pods -A -o wide > results/debug/pods.txt 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > results/debug/events.txt 2>&1 || true
          tail -50 results/debug/events.txt || true
      # The run id is in the artifact name, so records of two runs can be
      # joined later without guessing which run they came from.
      # actions/upload-artifact v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exp-${{ github.run_id }}-${{ matrix.chart }}-${{ matrix.world }}
          path: results/
          if-no-files-found: warn

  report:
    needs: [plan, observe]
    if: ${{ !cancelled() && needs.plan.outputs.kind == 'observe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/setup-go v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          # No cache of any kind: a later, more trusted job must never restore
          # something an earlier job on a runner with hostile charts wrote.
          cache: false
      # One directory per artifact (results/exp-<run>-<chart>-<world>/), never
      # merged: with merge-multiple a job whose chart is hostile could write a
      # file under another chart's name and replace that chart's record.
      # actions/download-artifact v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: exp-${{ github.run_id }}-*
          path: results
      # The records are data and nothing else: no step sources, evals or runs
      # anything under results/; only difftable reads it, as JSON. A record must
      # also say it belongs to the artifact it came from (chart id and world),
      # or the report does not run.
      - name: check records
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          rm -rf results/*/debug
          shopt -s nullglob
          dirs=(results/exp-"$RUN_ID"-*/)
          if [ "${#dirs[@]}" -eq 0 ]; then echo "no observe artifacts were downloaded" >&2; exit 1; fi
          if [ -n "$(find results -type l -print -quit)" ]; then echo "a symbolic link in the downloaded records" >&2; exit 1; fi
          for d in "${dirs[@]}"; do
            d="${d%/}"
            name="${d#results/exp-"$RUN_ID"-}"
            world="${name##*-}"
            chart="${name%-*}"
            if ! [[ "$world" =~ ^W[0-9]$ && -n "$chart" && "$chart" != "$name" ]]; then echo "artifact $d has no chart and world in its name" >&2; exit 1; fi
            while IFS= read -r -d '' f; do
              if ! jq -e --arg c "$chart" --arg w "$world" '.chart == $c and .world == $w' "$f" >/dev/null; then
                echo "record $f is not a record of chart $chart in world $world (the artifact it came from)" >&2
                exit 1
              fi
            done < <(find "$d" -type f -name '*.json' -print0)
          done
          echo "records checked: ${#dirs[@]} artifacts"
      # The experiment has no W2 (it matched W1 in every row of pilot 1), so
      # difftable compares W1 and W3. Certification passes the fix entry's own
      # cell worlds and ignore file.
      - name: difftable
        env:
          RUN_ID: ${{ github.run_id }}
          CELL_WORLDS: ${{ needs.plan.outputs.cell_worlds }}
          IGNORE_FILE: ${{ needs.plan.outputs.ignore }}
        run: |
          set -euo pipefail
          args=(-worlds W1,W3)
          if [ -n "$CELL_WORLDS" ]; then args+=(-cell-worlds "$CELL_WORLDS"); fi
          if [ -n "$IGNORE_FILE" ]; then args+=(-ignore "$IGNORE_FILE"); fi
          echo "run id: $RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          go run ./hack/compat-pilot/difftable "${args[@]}" results | tee table.md >> "$GITHUB_STEP_SUMMARY"
          go run ./hack/compat-pilot/difftable -json "${args[@]}" results > "report-$RUN_ID.json"
      # actions/upload-artifact v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compat-exp-report-${{ github.run_id }}
          path: |
            report-*.json
            table.md
            results/
